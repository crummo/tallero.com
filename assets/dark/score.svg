  <rect x="29.2" y="9" width="18" height="82" rx="3.2" fill="#232B3E"/>
  <rect x="52.8" y="9" width="18" height="82" rx="3.2" fill="#232B3E"/>
  <rect x="76.4" y="9" width="18" height="82" rx="3.2" fill="#232B3E"/>
  <rect x="9.6"  y="13" width="10" height="74" rx="1" fill="#fff"/>
  <rect x="33.2" y="13" width="10" height="74" rx="1" fill="#fff"/>
  <rect x="56.8" y="13" width="10" height="74" rx="1" fill="#fff"/>
  <rect x="80.4" y="13" width="10" height="74" rx="1" fill="#fff"/>
  <!-- diagonal slash in front -->
  <rect x="0"  y="41" width="100" height="18" rx="3.2" transform="rotate(-18 50 50)" fill="#232B3E"/>
  <rect x="4"  y="45" width="92"  height="10" rx="1"   transform="rotate(-18 50 50)" fill="#fff"/>
